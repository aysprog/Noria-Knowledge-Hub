<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Noria — Staff workspace</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=DM+Serif+Display&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="admin.css" />
  </head>
  <body class="admin-body">
    <header class="topbar">
      <a class="wordmark" href="index.html"
        ><span class="monogram">N</span><span>NORIA<small>STAFF WORKSPACE</small></span></a
      >
      <div class="staff-actions"><a class="team-link" href="index.html">Return to library</a></div>
    </header>
    <main class="admin-main">
      <div class="admin-heading">
        <div>
          <p class="eyebrow">CONTENT OPERATIONS</p>
          <h1>Editorial <em>workspace.</em></h1>
          <p>Manage the guide collection and monitor reader activity across the knowledge hub.</p>
        </div>
      </div>
      <section class="stats" id="stats"></section>
      <section class="admin-panel">
        <div class="panel-heading">
          <div>
            <p class="eyebrow">KNOWLEDGE MANAGEMENT</p>
            <h2>Article register</h2>
          </div>
          <button class="admin-primary" id="newArticle">+ New article</button>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Article</th>
                <th>Collection</th>
                <th>Visibility</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="articleRows"></tbody>
          </table>
        </div>
      </section>
    </main>
    <dialog id="editor" class="editor-dialog">
      <form id="editorForm">
        <button type="button" class="dialog-close" id="closeEditor" aria-label="Close">×</button>
        <p class="eyebrow">ARTICLE EDITOR</p>
        <h2 id="editorHeading">Create article</h2>
        <input type="hidden" name="id" /><label
          >Title<input name="title" required minlength="8" /></label
        ><label
          >Collection<select name="category" required>
            <option>Account & profile</option>
            <option>Payments & billing</option>
            <option>Privacy & security</option>
            <option>Orders & delivery</option>
            <option>Troubleshooting</option>
          </select></label
        ><label
          >Short description<textarea
            name="deck"
            required
            minlength="20"
            rows="2"
          ></textarea></label
        ><label>Reading time<input name="read" value="4 min" /></label
        ><label
          >Sections <small>One section per line. Format: Heading | Paragraph</small
          ><textarea
            name="sections"
            required
            rows="9"
            placeholder="Before you begin | Explain the first step..."
          ></textarea></label
        ><label>Important note<textarea name="callout" rows="2"></textarea></label
        ><label class="check-label"
          ><input type="checkbox" name="featured" /> Feature on home page</label
        ><label
          >Status<select name="status">
            <option value="published">Published</option>
            <option value="draft">Draft</option>
          </select></label
        ><button class="admin-primary" type="submit">Save article</button>
      </form>
    </dialog>
    <script src="data.js"></script>
    <script src="admin.js"></script>
  </body>
</html>
